    <h2>Volunteer With Us</h2>
    <p>Join our mission to serve communities. Fill out the form below — once approved by admin, you’ll become an official member.</p>

      <div class="form-group">

      </div>

        <label for="interest">Area of Interest:</label>
        <input type="text" id="interest" name="interest" placeholder="Education / Healthcare / Rural Development">
