<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel | Asam Charitable Trust</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    function checkPassword() {
      const password = prompt("Enter Admin Password:");
      const correctPassword = "asamadmin2026"; // <-- change here if you want a new password
      if (password && password.trim() === correctPassword) {
        document.getElementById("admin-section").style.display = "block";
      } else {
        alert("Access Denied! Incorrect Password.");
        window.location.href = "index.html";
      }
    }
    window.onload = checkPassword;
  </script>
</head>
<body>
  <header>
    <h1>Admin Panel</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="initiatives.html">Initiatives</a></li>
        <li><a href="donate.html">Donate</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hidden until password is correct -->
  <section id="admin-section" style="display:none;">
    <div class="container">
      <h2>Volunteer Approvals</h2>
      <iframe src="volunteers.txt" width="100%" height="200"></iframe>

      <form action="approve-volunteer.php" method="post">
        <div class="form-group">
          <label for="email">Volunteer Email to Approve:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="cta-button">Approve Volunteer</button>
      </form>

      <hr>

      <h2>Donation Records</h2>
      <iframe src="donations.txt" width="100%" height="200"></iframe>

      <form action="update-donation.php" method="post">
        <div class="form-group">
          <label for="month">Month:</label>
          <input type="text" id="month" name="month" required>
        </div>
        <div class="form-group">
          <label for="donation">Donation Amount (₹):</label>
          <input type="number" id="donation" name="donation" required>
        </div>
        <div class="form-group">
          <label for="expense">Expense Amount (₹):</label>
          <input type="number" id="expense" name="expense" required>
        </div>
        <button type="submit" class="cta-button">Update Record</button>
      </form>

      <hr>

      <h2>Upload Event Photos</h2>
      <form action="upload-photo.php" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="photo">Choose Event Photo:</label>
          <input type="file" id="photo" name="photo" accept="image/*" required>
        </div>
        <button type="submit" class="cta-button">Upload Photo</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Asam Charitable Trust. Admin Access Only.</p>
  </footer>
</body>
</html>
