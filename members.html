  <section id="members">
    <div class="container">
      <h2>Add New Member</h2>
      <form action="submit-member.php" method="post">
        <div class="form-group">
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone:</label>
          <input type="text" id="phone" name="phone" required>
        </div>
        <div class="form-group">
          <label for="role">Role in Trust:</label>
          <input type="text" id="role" name="role" placeholder="Volunteer / Coordinator / Member">
        </div>
        <button type="submit" class="cta-button">Add Member</button>
      </form>
    </div>
